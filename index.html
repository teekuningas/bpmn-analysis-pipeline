<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Analysis pipelines as BPMN</title>
<link rel="stylesheet" href="vendor/assets/diagram-js.css"/>
<link rel="stylesheet" href="vendor/assets/bpmn-js.css"/>
<link rel="stylesheet" href="app/theme.css"/>
</head>
<body>
<header>
  <h1>Analysis pipelines as BPMN</h1>
  <select id="study" aria-label="Which analysis"></select>
  <span id="question"></span>
  <a href="https://github.com/teekuningas/bpmn-analysis-pipeline">source</a>
</header>

<main>
  <div id="canvas"></div>
  <aside id="drawer" hidden>
    <nav id="tabs">
      <button type="button" data-tab="data">Data</button>
      <button type="button" data-tab="value">Value</button>
      <button type="button" data-tab="log">Log</button>
      <button type="button" data-tab="result">Result</button>
      <button type="button" data-tab="model" class="apart">Model</button>
      <button type="button" id="close" aria-label="Close">×</button>
    </nav>
    <div id="panel"></div>
  </aside>
</main>

<footer>
  <div id="caption"></div>
  <div id="legend"></div>
  <div id="types"></div>

  <div id="controls">
    <span class="field">Model <button type="button" id="model">Scripted stand-in</button></span>
    <span id="settings"></span>
    <label class="field" title="How long to hold on each step, so a run can be followed">
      Delay
      <input type="range" id="pace" min="0" max="600" step="50" value="150"/>
      <output id="pace-out">150 ms</output>
    </label>
    <button type="button" id="browse">Data</button>
    <button type="button" id="run">Run</button>
    <button type="button" id="stop" hidden>Stop</button>
  </div>

  <div id="progress"></div>
</footer>

<script src="vendor/bpmn-navigated-viewer.js"></script>
<script type="module" src="app/ui.js"></script>
</body>
</html>
